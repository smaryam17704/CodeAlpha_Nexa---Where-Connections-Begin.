{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Nexa — Connect Beyond.{% endblock %}</title>
<link rel="icon" type="image/png" href="{% static 'img/nexa-logo.png' %}">
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/shell.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
<link rel="stylesheet" href="{% static 'css/premium.css' %}">
{% block extra_css %}{% endblock %}
<script>
(function () {
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }
  const pref = "{{ active_theme|default:'system' }}";
  document.documentElement.setAttribute('data-theme-pref', pref);
  let resolved = pref;
  if (pref === 'system') {
    resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', resolved);
})();
</script>
</head>
<body>
{% if messages %}
  {% for message in messages %}
    <span data-django-message="{{ message }}" data-message-type="{% if message.tags == 'error' %}error{% else %}success{% endif %}" style="display:none"></span>
  {% endfor %}
{% endif %}

{% block body %}{% endblock %}

<div id="toast-region"></div>
<script src="{% static 'js/toast.js' %}"></script>
<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/nexa.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
