{% extends "base.html" %}
{% load static %}
{% block title %}Nexa — Check your email{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="card auth-card" style="text-align:center;">
    <a href="{% url 'core:landing' %}" class="brand-mark"><img src="{% static 'img/nexa-logo.png' %}" alt="Nexa logo"></a>
    <h1 class="text-page-title auth-title">Check your email</h1>
    <p class="auth-subtitle">If an account exists for that address, we've sent instructions to reset your password.</p>
    <div class="auth-footer-link"><a href="{% url 'accounts:login' %}">Back to login</a></div>
  </div>
</div>
{% endblock %}
