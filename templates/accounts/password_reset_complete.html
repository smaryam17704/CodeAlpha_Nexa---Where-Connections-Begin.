{% extends "base.html" %}
{% load static %}
{% block title %}Nexa — Password reset complete{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="card auth-card" style="text-align:center;">
    <a href="{% url 'core:landing' %}" class="brand-mark"><img src="{% static 'img/nexa-logo.png' %}" alt="Nexa logo"></a>
    <h1 class="text-page-title auth-title">Password updated</h1>
    <p class="auth-subtitle">Your password has been changed successfully.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Log in</a>
  </div>
</div>
{% endblock %}
