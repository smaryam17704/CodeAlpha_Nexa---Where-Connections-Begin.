{% extends "base.html" %}
{% load static %}
{% block title %}Nexa — You're all set{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/components.css' %}">{% endblock %}
{% block body %}
<div class="onboarding-page">
  <a href="{% url 'core:landing' %}" class="brand-mark"><img src="{% static 'img/nexa-logo.png' %}" alt="Nexa logo" style="height:34px;"></a>
  <div class="onboarding-progress">
    <div class="dot done"></div><div class="dot done"></div><div class="dot done"></div><div class="dot done"></div>
  </div>
  <div class="card onboarding-card" style="text-align:center;">
    <div class="pillar-icon" style="margin:0 auto 20px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1 class="text-page-title" style="margin-bottom:8px;">You're all set, {{ request.user.profile.get_display_name }}!</h1>
    <p class="text-meta" style="margin-bottom:28px;">Your Nexa account is ready. Time to connect beyond.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary btn-block">Enter Nexa</a>
  </div>
</div>
{% endblock %}
